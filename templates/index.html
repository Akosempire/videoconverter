<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOV to MP4 Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>MOV to MP4 Converter</h1>

      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}

      {% if success %}
      <div class="alert success">Conversion complete.</div>
      <a class="download-link" href="{{ download_url }}" download>Download {{ filename }}</a>
      {% endif %}

      <form action="/convert" method="post" enctype="multipart/form-data" class="upload-form">
        <label for="video">Select a .mov file</label>
        <input type="file" id="video" name="video" accept=".mov,.MOV" required />
        <button type="submit">Convert to MP4</button>
      </form>
    </main>
  </body>
</html>
